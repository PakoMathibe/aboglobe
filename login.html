<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | ABOGLOBE International INC</title>
  <meta name="description" content="Sign in to your ABOGLOBE vendor portal to manage orders, shipments, and documents." />
  <link rel="stylesheet" href="https://cdn.lineicons.com/4.0/lineicons.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
</head>
<body class="auth-body bg-brand-cream text-brand-dark">

  <div id="preloader" aria-hidden="true">
    <div class="preloader-mark"></div>
    <div class="preloader-text">ABOGLOBE</div>
  </div>
  <div id="scroll-progress" class="scroll-progress" aria-hidden="true"></div>

  <!-- Minimal auth nav -->
  <nav class="auth-nav" aria-label="Authentication">
    <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3" aria-label="ABOGLOBE home">
        <img src="images/logo.png" alt="ABOGLOBE logo" class="h-12 w-auto" width="48" height="48" />
      </a>
      <a href="signup.html" class="btn btn-primary text-sm">Create Account</a>
    </div>
  </nav>

  <main class="auth-main">
    <div class="auth-wrap">

      <div class="auth-header">
        <div class="auth-icon" aria-hidden="true">
          <i class="lni lni-lock"></i>
        </div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to access your vendor portal</p>
      </div>

      <div class="auth-card">
        <form id="login-form" novalidate>

          <!-- Email -->
          <div class="auth-field">
            <label for="email" class="auth-label">Email address</label>
            <div class="relative">
              <i class="lni lni-envelope auth-input-icon" aria-hidden="true"></i>
              <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
                placeholder="you@company.com"
                class="auth-input auth-input--with-left-icon"
              />
            </div>
          </div>

          <!-- Password -->
          <div class="auth-field">
            <div class="auth-label-row">
              <label for="password" class="auth-label">Password</label>
              <a href="#" class="text-xs text-brand-gold hover:underline font-medium">Forgot password?</a>
            </div>
            <div class="relative">
              <i class="lni lni-lock auth-input-icon" aria-hidden="true"></i>
              <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
                placeholder="Enter your password"
                class="auth-input auth-input--with-left-icon auth-input--with-right-icon"
              />
              <button type="button" id="toggle-password" class="auth-input-icon auth-input-icon--right" aria-label="Show password">
                <i class="lni lni-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <!-- Remember -->
          <div class="auth-checkbox">
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember">Remember me for 30 days</label>
          </div>

          <!-- Submit -->
          <button type="submit" class="auth-submit auth-submit--primary">
            Sign In <i class="lni lni-arrow-right" aria-hidden="true"></i>
          </button>

          <p id="login-error" class="auth-error hidden" role="alert"></p>
        </form>

        <!-- Divider -->
        <div class="auth-divider"><span>or continue with</span></div>

        <!-- SSO -->
        <div class="auth-sso">
          <button type="button" class="auth-sso-btn">
            <i class="lni lni-google" aria-hidden="true"></i> Google
          </button>
          <button type="button" class="auth-sso-btn">
            <i class="lni lni-microsoft" aria-hidden="true"></i> Microsoft
          </button>
        </div>
      </div>

      <p class="auth-footer-link">
        Don't have an account?
        <a href="signup.html">Create one</a>
      </p>

      <p class="auth-back-link">
        <a href="index.html">
          <i class="lni lni-arrow-left" aria-hidden="true"></i> Back to main site
        </a>
      </p>

    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
